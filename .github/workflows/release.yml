name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        default: testpypi
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  resolve-target:
    name: Resolve publish target
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.target }}" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "${{ github.sha }}" origin/master 2>/dev/null; then
            echo "target=pypi" >> "$GITHUB_OUTPUT"
          else
            echo "target=testpypi" >> "$GITHUB_OUTPUT"
          fi

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23
        # cibuildwheel reads [tool.cibuildwheel] in pyproject.toml:
        # cp310–cp313, pytest run inside each wheel env.

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to ${{ needs.resolve-target.outputs.target == 'pypi' && 'PyPI' || 'TestPyPI' }}
    needs: [sdist, wheels, resolve-target]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve-target.outputs.target }}
      url: ${{ needs.resolve-target.outputs.target == 'pypi' && 'https://pypi.org/p/spindle-rt' || 'https://test.pypi.org/p/spindle-rt' }}
    permissions:
      id-token: write # required for Trusted Publishing
      contents: read
      attestations: write # required for PEP 740 attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{sdist,wheels-*}"
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        if: needs.resolve-target.outputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          verbose: true

      - name: Publish to TestPyPI
        if: needs.resolve-target.outputs.target != 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false
          verbose: true
